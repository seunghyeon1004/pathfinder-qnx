rten the work.", "evidence": [19892, 20142], "inst": [[1084.198, 1218.381], [1384.198, 1523.365], [1684.198, 1826.363], [1984.198, 2128.364], [2284.198, 2430.365], [2584.198, 2731.377], [2884.198, 3033.365], [3184.198, 3334.381], [3484.198, 3637.376], [3784.198, 3939.364]], "causes": ["F3"], "waiter": null, "owner": null, "llm": ""}, {"id": "F3", "kind": "watchdog_reset", "sev": "critical", "title": "Watchdog fired 7 time(s): the system would have reset", "t0": 1793.687, "t1": 3637.455, "lanes": [], "root": "The application's watchdog reported a missed heartbeat 7 time(s) (events #10250, #11016, #11904, #14812). Preceded by F2.", "fix": "Remove the cause listed above; on the real system each of these would have been a reset, as on Mars Pathfinder in 1997.", "evidence": [10250, 11016, 11904, 14812, 15527, 16680], "inst": [[1793.687, 1794.687], [2102.15, 2103.15], [2409.922, 2410.922], [2717.086, 2718.086], [3024.933, 3025.933], [3330.952, 3331.952], [3636.455, 3637.455]], "causes": [], "waiter": null, "owner": null, "llm": ""}], "evidence": {"11904": {"t": 2409.922, "raw": "t:0x145b8ed0bd0 CPU:00 USREVENT        :EVENT:4            STR:\"WATCHDOG RESET #3\", d0:0x43544157 d1:0x474f4448 d2:0x53455220 d3:0x23205445 d4:0x00000033 d5:0x00000000"}, "19937": {"t": 3788.185, "raw": "t:0x1460b02d710 CPU:00 THREAD          :THRUNNING          pid:4923423 tid:3 priority:20 policy:1"}, "15527": {"t": 3024.933, "raw": "t:0x145dd8ddca8 CPU:00 USREVENT        :EVENT:4            STR:\"WATCHDOG RESET #5\", d0:0x43544157 d1:0x474f4448 d2:0x53455220 d3:0x23205445 d4:0x00000035 d5:0x00000000"}, "11016": {"t": 2102.15, "raw": "t:0x145a6989260 CPU:00 USREVENT        :EVENT:4            STR:\"WATCHDOG RESET #2\", d0:0x43544157 d1:0x474f4448 d2:0x53455220 d3:0x23205445 d4:0x00000032 d5:0x00000000"}, "19913": {"t": 3784.367, "raw": "t:0x1460ac8a4a0 CPU:00 THREAD          :THREADY            pid:4923423 tid:2 priority:10 policy:1"}, "10250": {"t": 1793.687, "raw": "t:0x145943991a0 CPU:00 US const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}

function draw(){
 W=svg.clientWidth||1000;const H=TOP+D.lanes.length*LH+30;svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('height',H);svg.innerHTML='';

 for(let t=Math.ceil(v0/step)*step;t<=v1;t+=step){el('line',{x1:X(t),x2:X(t),y1:TOP-6,y2:TOP+D.lanes.length*LH,stroke:css('--line'),'stroke-width':1});
  const tx=el('text',{x:X(t)+2,y:TOP-10,fill:css('--mut'),'font-size':10});tx.textContent=(t-D.meta.w0).toFixed(step<1?1:0)+' ms'}
 const f=sel!=null?D.findings.find(x=>x.id===sel):null;
 D.lanes.forEach((L,i)=>{const y=TOP+i*LH;
  const lb=el('text',{x:4,y:y+LH/2-2,fill:css('--fg'),'font-size':12,'font-weight':600});lb.textContent=L.label;

  L.segs.forEach(s=>{if(s[1]<v0||s[0]>v1)return;const x0=Math.max(G,X(s[0])),x1=Math.min(W-PAD,X(s[1]));if(x1-x0<0.4)return;
   const r=el('rect',{x:x0,y:y+12,width:Math.max(0.6,x1-x0),height:LH-18,fill:css(COL[s[2]]),opacity:s[2]===8?.55:1});
   r.addEventListener('mousemove',e=>tip(e,L.label+'\n'+NAMES[s[2]]+'\npriority '+s[3]+'  cpu '+s[4]+'\n'+(s[0]-D.meta.w0).toFixed(2)+' - '+(s[1]-D.meta.w0).toFixed(2)+' ms ('+(s[1]-s[0]).toFixed(2)+' ms)\nevent #'+s[5]));

   el('path',{d:d,fill:'none',stroke:css('--info'),'stroke-width':1.2});}
 });

   const t=el('text',{x:x+5,y:(a+b)/2,fill:css('--fg'),'font-size':11});t.textContent='waits for';}}

 v0=Math.max(D.meta.w0,t-(t-v0)*k);v1=Math.min(D.meta.w1,t+(v1-t)*k);if(v1-v0<0.5){v1=v0+0.5}draw()},{passive:false});

const reset=()=>{v0=D.meta.w0;v1=D.meta.w1;draw()};svg.addEventListener('dblclick',reset);document.getElementById('rst').onclick=reset;window.addEventListener('resize',draw);
